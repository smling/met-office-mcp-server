spring:
  application:
    name: met-office-mcp-server
  ai:
    mcp:
      server:
        name: met-office-mcp-server
        protocol: STREAMABLE
        type: SYNC

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    export:
      otlp:
        enabled: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  level:
    io.github.smling.met_office_mcp_server: ${MET_OFFICE_MCP_LOG_LEVEL:INFO}

met-office:
  atmospheric:
    api-key: ${MET_OFFICE_ATMOSPHERIC_API_KEY:}
    base-url: ${MET_OFFICE_ATMOSPHERIC_BASE_URL:https://data.hub.api.metoffice.gov.uk/atmospheric-models/1.0.0}
  site-specific:
    api-key: ${MET_OFFICE_SITE_SPECIFIC_API_KEY:}
    global-spot-base-url: ${MET_OFFICE_SITE_SPECIFIC_GLOBAL_SPOT_BASE_URL:https://data.hub.api.metoffice.gov.uk/sitespecific/v0/point}
    bpf-base-url: ${MET_OFFICE_SITE_SPECIFIC_BPF_BASE_URL:https://data.hub.api.metoffice.gov.uk/mo-site-specific-blended-probabilistic-forecast/1.0.0}
  observations:
    api-key: ${MET_OFFICE_OBSERVATIONS_API_KEY:}
    base-url: ${MET_OFFICE_OBSERVATIONS_BASE_URL:https://data.hub.api.metoffice.gov.uk/observation-land/1}
  map-images:
    api-key: ${MET_OFFICE_MAP_IMAGES_API_KEY:}
    base-url: ${MET_OFFICE_MAP_IMAGES_BASE_URL:https://data.hub.api.metoffice.gov.uk/map-images/1.0.0}
